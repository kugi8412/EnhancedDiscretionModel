experiment_name: "cVQVAE_with_LegNetV2_Oracle"
seed: 7898

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "HydraDNA_cVQVAE"
  kwargs:
    in_ch: 4
    stem_ch: 128
    gru_dim: 128
    vq_dim: 64
    num_embeddings: 512
    depth: 2

oracle:
  apply: true
  config_path: "../../config/LegNetOracle.yaml"
  weights_path: "train_logs/legnet_oracle/LegNetV2_Oracle_Clean_seed7898.pth"

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false
  target_noise:
    apply: false

training:
  epochs: 100
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 1.0e-4
  early_stop: 16
  log_dir: "train_logs/cvqvae"

  # Loss for VQVAE
  oracle_warmup_epochs: 16
  oracle_rampup_epochs: 4
  oracle_max_weight: 0.5
  recon_weight: 2.0
  vq_weight: 1.0
  oracle_bidirectional: false

  scheduler:
    apply: true
    type: "cosine"
    eta_min: 1.0e-6
    warmup_fraction: 0.1
    weight_decay_scheduler: true
    weight_decay_min: 1.0e-6
