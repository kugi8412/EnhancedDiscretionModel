# DeepSTARR + Masked Convolution (SuperKernel)
#
# Each Conv1d filter learns its own effective receptive-field width via a
# differentiable sigmoid mask parameterised by a per-filter radius r.
# The mask is applied to the kernel weights before every forward pass:
#
#   mask(k) = sigmoid( tau * (r - |k - kernel_centre|) )
#
# r is updated by backprop (trainable: true) so the network discovers
# which filters benefit from wide vs. narrow receptive fields.
#
# tau controls boundary sharpness:
#   tau = 5   smooth transition (default, good for training stability)
#   tau = 20  near-binary mask (harder, more structural inductive bias)
#
# r (0–1) is the initial radius fraction of the kernel half-width:
#   r = 1.0   full kernel active at init (no initial masking)
#   r = 0.5   inner half of kernel active at init
#

experiment_name: "DeepSTARR_MaskedConv"
seed: 7898

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "DeepSTARR"
  kwargs:
    seq_len: 249
    kernel_size1: 7
    kernel_size2: 3
    kernel_size3: 5
    kernel_size4: 3
    num_filters: 256
    num_filters2: 60
    num_filters3: 60
    num_filters4: 120
    dropout_prob: 0.4
    dense_neurons1: 256
    dense_neurons2: 256
    pad: 'same'
    permute_before_flatten: false

  mask_conv:
    enabled: true
    r: 0.7              # initial radius: start at 70% of kernel half-width
    tau: 5.0            # sigmoid sharpness (higher => harder boundary)
    trainable: true     # radius updated by backprop
    skip_depthwise: false
    skip_pointwise: true

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false
  target_noise:
    apply: false

training:
  lr: 0.002
  weight_decay: 0.0001
  epochs: 100
  early_stop: 10
  scheduler:
    apply: false
