experiment_name: "DeepSTARR_Vanilla"
seed: 7898

comet:
  api_key: "V6s4QJ97ca130GE8M4G4MlU5D"
  project_name: "kamb"
  workspace: "kugi8412"

model:
  name: "DeepSTARR"
  kwargs:
    seq_len: 249      # Wróciło na 249, bo bez augmentacji (insercji) sekwencja nie rośnie
    kernel_size1: 7
    kernel_size2: 3
    kernel_size3: 5
    kernel_size4: 3
    num_filters: 256
    num_filters2: 60
    num_filters3: 60
    num_filters4: 120
    dropout_prob: 0.4
    dense_neurons1: 256
    dense_neurons2: 256
    pad: 'same'
    permute_before_flatten: false

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false      # WYŁĄCZONA augmentacja (brak mutacji, delecji, RC)
  target_noise:
    apply: false      # WYŁĄCZONY szum na etykietach (Target Noise)

training:
  lr: 0.002
  epochs: 100
  early_stop: 10
  scheduler:          
    apply: false      # Gwarantuje stały Learning Rate (brak Cosine Annealing/Warmup)
