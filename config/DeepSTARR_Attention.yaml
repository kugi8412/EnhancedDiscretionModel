# DeepSTARR + Learnable Attention
# A purely-parametric (input-independent) attention tensor is inserted
# immediately after each Conv1d layer.  No input projection is performed —
# the weights are directly trained scalars that the network learns to set.
#
# Two components can be enabled independently:
#
#   channel   – a [C] parameter vector gated through sigmoid.
#               Learns which feature channels are globally important.
#               Starts near 1 (near-identity) so training is undisturbed.
#
#   position  – a [1, C, L] parameter tensor normalised with softmax over
#               the position axis (then multiplied back by L to preserve
#               magnitude).  Uniform initialisation = exact identity.
#               Learns which sequence positions matter per channel.
#               Requires seq_len to be set.
#
#   both      – enables both channel and position together.

experiment_name: "DeepSTARR_Attention"
seed: 7898

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "DeepSTARR"
  kwargs:
    seq_len: 249
    kernel_size1: 7
    kernel_size2: 3
    kernel_size3: 5
    kernel_size4: 3
    num_filters: 256
    num_filters2: 60
    num_filters3: 60
    num_filters4: 120
    dropout_prob: 0.4
    dense_neurons1: 256
    dense_neurons2: 256
    pad: 'same'
    permute_before_flatten: false

  attention:
    enabled: true
    type: "channel"     # "channel" | "position" | "both"
    seq_len: 249
    skip_pointwise: true
    skip_depthwise: false

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false
  target_noise:
    apply: false

training:
  lr: 0.002
  weight_decay: 0.0001
  epochs: 100
  early_stop: 10
  scheduler:
    apply: false
