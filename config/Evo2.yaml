experiment_name: "Evo2_FrozenHeads_v1"
seed: 42

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "Evo2"
  kwargs:
    model_name: "evo2_1b_base"
    freeze_backbone: true       # train regression heads only
    lora: false
    hidden_dim: 256
    dropout_rate: 0.2
    pool: "mean"s

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 8
  augment: false
  num_workers: 0
  strand_correct: true

training:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  early_stop: 8
  log_dir: "train_logs"

  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.1
    eta_min: 1.0e-6
