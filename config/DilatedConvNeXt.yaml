experiment_name: "DilatedConvNeXt"
seed: 7898

model:
  name: "DilatedConvNeXt"
  kwargs:
    seq_len: 249
    filters0: 256
    filters1: 128
    nr_res_blocks: 7
    rate_mult: 1.5
    kernel0: 15
    kernel1: 3
    dropout: 0.3
    final_dropout: 0.1
    dense_dim: 256

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false

training:
  lr: 0.001
  weight_decay: 0.01
  epochs: 100
  early_stop: 10
  log_dir: "train_logs"
  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.05
    eta_min: 1.0e-6
