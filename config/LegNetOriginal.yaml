# ==========================================
# Original LegNet (SeqNN) Configuration
# Eeproduction of autosome-ru/LegNet (https://github.com/autosome-ru/LegNet/)
# Reference: Penzar, Nogina et al., Bioinformatics 2023
# ==========================================

experiment_name: "LegNetOriginal_Vanilla"
seed: 42

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "LegNetOriginal"
  kwargs:
    seqsize: 249
    in_channels: 4
    use_single_channel: false
    block_sizes: [256, 256, 128, 128, 64, 64, 32, 32]
    ks: 5
    resize_factor: 4
    filter_per_group: 2
    se_reduction: 4
    final_ch: 18
    bn_momentum: 0.1

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false
  target_noise:
    apply: false

training:
  lr: 0.001
  weight_decay: 0.0001
  epochs: 100
  early_stop: 15
  log_dir: "train_logs"
  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.05
    eta_min: 1.0e-6
