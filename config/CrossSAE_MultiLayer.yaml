# ============================================================
# Cross SAE Multi-Layer: DeepSTARR vs LegNet  — Layer-wise Comparison
# Extracts activations from ALL layers of both models, computes CKA
# heatmaps to reveal which layers learn similar representations,
# and optionally trains SAEs on the most similar layer pairs.
#
# Usage:
#   python src/py/cross_sae.py \
#       --sae_config config/CrossSAE_MultiLayer.yaml \
#       --multilayer \
#       --sae_per_layer \
#       --top_k_pairs 6
#
# Without --sae_per_layer, only CKA heatmaps are produced (fast).
# With --sae_per_layer, SAE dictionary comparison is run on
# the top-K most CKA-similar cross-model layer pairs.
# ============================================================

seed: 42

models:
  - name: DeepSTARR
    config: config/DeepSTARR.yaml
    weights: src/py/train_logs/DeepSTARR_Vanilla_seed7898.pth
    # Optional: specify which layers to capture (default: auto-detect).

  - name: LegNet
    config: config/LegNetPlus.yaml
    weights: src/py/train_logs/LegNet_Augmented_seed42.pth

data_config: config/DeepSTARR.yaml
output_dir: results/cross_sae_multilayer

sae:
  hidden_dim: 256
  l1_coeff: 1.0e-3
  epochs: 100
  lr: 1.0e-3
  batch_size: 256
