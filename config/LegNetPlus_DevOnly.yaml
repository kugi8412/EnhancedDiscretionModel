# ============================================================
# LegNetPlus — Single Output Ablation (Dev only)
# ============================================================
# Trains the same LegNetPlus architecture but with ONLY the Dev
# enhancer output head active, ignoring the Hk head entirely.
# 
# This serves as an ablation study to measure how much multitask
# learning (Dev + Hk jointly) benefits each individual task.
#
# Compare results against the full multitask LegNetPlus.yaml
# to quantify multitask transfer.
#
# Usage:
#   python train_cnn.py -c ../../config/LegNetPlus_DevOnly.yaml
#
# For Hk-only ablation, change output_head to "hk".
# ============================================================

experiment_name: "LegNetPlus_DevOnly"
seed: 42

model:
  name: "LegNetPlus"
  output_head: "dev"           # <<< "dev", "hk", or "both" (default)
  kwargs:
    in_ch: 4
    stem_ch: 256
    ef_ks: 5
    block_sizes: [256, 128, 128, 64, 64, 32, 32]
    pool_sizes: [1, 2, 1, 2, 1, 2, 1]
    expansion: 4
    drop_path_rate: 0.1
    seq_len: 249

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false
  num_workers: 4

training:
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 100
  early_stop: 15
  log_dir: "train_logs"

  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.05
    eta_min: 1.0e-6
