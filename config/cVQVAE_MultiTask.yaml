experiment_name: "cVQVAE_MultiTask_v1"
seed: 42

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "cVQVAE_MultiTask"
  kwargs:
    in_ch: 4
    stem_ch: 192
    gru_dim: 192
    vq_dim: 128
    num_embeddings: 4096
    encoder_depth: 4           # heavy encoder — 4 downsampling stages
    decoder_depth: 2           # light decoder — 2 upsampling stages
    commitment_cost: 0.25
    classifier_dim: 256
    dropout_rate: 0.2          # non-zero enables MC Dropout at inference
    kernel_size: 5
    film_hidden: 128
    uncond_dropout_rate: 0.15  # classifier-free guidance drop rate

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 64
  augment: true
  num_workers: 4

  target_noise:
    apply: true
    std: 0.05

training:
  lr: 0.0003
  weight_decay: 0.0001
  epochs: 150
  early_stop: 25
  oracle_warmup_epochs: 16
  oracle_rampup_epochs: 6
  oracle_max_weight: 0.75      # oracle guides Gumbel outputs; heads supervised directly
  recon_weight: 2.0
  vq_weight: 1.0
  oracle_bidirectional: true
  log_dir: "train_logs"

  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.08
    eta_min: 1.0e-6

oracle:
  apply: true
  config_path: "../../config/LegNetNewPlus.yaml"
  weights_path: "train_logs/LegNetV2_Augmented_seed7898.pth"
