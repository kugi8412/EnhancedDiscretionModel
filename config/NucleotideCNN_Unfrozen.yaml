# ============================================================
# NucleotideCNN — Unfrozen Backbone (Full Fine-Tuning Mode)
# Same as NucleotideCNN.yaml but backbone is TRAINABLE.
# This allows end-to-end gradient flow through the backbone,
# which can improve nucleotide prediction at the cost of:
#   - Higher memory usage
#   - Risk of catastrophic forgetting in backbone
#   - Longer training time
#
# Usage:
#   python train_nucleotide.py -c ../../config/NucleotideCNN_Unfrozen.yaml
#   python train_nucleotide.py -c ../../config/NucleotideCNN_Unfrozen.yaml --train-mlp
#   python train_nucleotide.py -c ../../config/NucleotideCNN_Unfrozen.yaml --uncertainty
#   python train_nucleotide.py -c ../../config/NucleotideCNN_Unfrozen.yaml --active-learning
# ============================================================

experiment_name: "NucleotideCNN_Unfrozen_v1"
seed: 42

model:
  name: "NucleotideCNN"
  kwargs:
    seq_len: 249
    hidden_ch: 128
    n_layers: 6
    kernel_size: 5
    dropout: 0.15              # Slightly higher dropout for regularization
    max_layers: 8
    freeze_backbone: false     # backbone is treinable
    mc_samples: 20             # Default MC Dropout samples

    backbone_config: "../../config/LegNetPlus.yaml"
    backbone_weights: "results/models/LegNet/best_model.pth"

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 64               # Smaller batch
  augment: false
  num_workers: 4

training:
  lr: 0.00005                  # Lower LR to protect backbone
  weight_decay: 0.001          # Stronger regularization
  epochs: 60
  early_stop: 20
  log_dir: "train_logs"

  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.1       # Longer warmup for stable unfreezing
    eta_min: 1.0e-7

# MLP Predictor settings (used with --train-mlp)
mlp_predictor:
  hidden_dims: [256, 128]
  lr: 0.001
  epochs: 100
  dropout: 0.1
  early_stop: 20
  batch_size: 256
