# ReverseNet + SuperKernel Baseline

experiment_name: "ReverseNet_SuperKernel_Baseline"
seed: 42

model:
  name: "ReverseNet_SuperKernel"
  kwargs:
    num_filters: 256
    num_filters2: 60
    num_filters3: 60
    num_filters4: 120
    kernel_size1: 12
    kernel_size2: 5
    kernel_size3: 3
    kernel_size4: 3
    dense_neurons1: 256
    dense_neurons2: 256
    dropout_prob: 0.6
    pad: 'same'
    permute_before_flatten: false
    seq_len: 249

training:
  epochs: 100
  lr: 1.0e-3
  weight_decay: 1.0e-2
  early_stop: 15
  log_dir: "train_logs"

  scheduler:
    apply: true
    type: "cosine"
    eta_min: 1.0e-6
    warmup_fraction: 0.1
    weight_decay_scheduler: true
    weight_decay_min: 1.0e-6

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false
  target_noise:
    apply: false

# Loffing for COMET
comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""
