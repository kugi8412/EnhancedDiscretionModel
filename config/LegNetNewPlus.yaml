experiment_name: "LegNetV2_Augmented"
seed: 7898

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "LegNetV2"
  kwargs:
    in_ch: 4
    stem_ch: 256
    stem_ks: 5
    ef_ks: 5
    ef_block_sizes: [256, 128, 128, 64, 64, 32, 32]
    pool_sizes: [1, 2, 1, 2, 1, 2, 1]
    resize_factor: 4

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: true
  num_workers: 4

  evoaug:
    max_augs_per_seq: 2
    hard_aug: false
    distribution: "poisson"
    poisson_lambda: 1.0
    augmentations:
      - name: "RandomDeletion"
        kwargs: {delete_min: 0, delete_max: 20}
      - name: "RandomRC"
        kwargs: {rc_prob: 0.5}
      - name: "RandomInsertion"
        kwargs: {insert_min: 0, insert_max: 20}
      - name: "RandomTranslocation"
        kwargs: {shift_min: 0, shift_max: 20}
      - name: "RandomMutation"
        kwargs: {mut_frac: 0.05}
      - name: "NormalizeNoise" 
        kwargs: {noise_mean: 0.0, noise_std: 0.3}

  target_noise:
    apply: true
    std: 0.05

training:
  lr: 0.0005
  weight_decay: 0.0002
  epochs: 100
  early_stop: 20
  log_dir: "train_logs"
  scheduler:
    apply: false
    type: "cosine"
    warmup_fraction: 0.1
    eta_min: 1.0e-6
