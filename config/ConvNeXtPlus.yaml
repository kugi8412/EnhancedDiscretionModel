experiment_name: "ConvNeXt_DNA_Augmented"
seed: 7898

# --- SEKCJA LOGOWANIA ---
comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

# --- DEFINICJA ARCHITEKTURY CONVNEXT-DNA ---
model:
  name: "ConvNeXt_DNA"
  kwargs:
    in_ch: 4
    stem_ch: 48
    dims: [48, 96, 192, 384]
    depths: [2, 2, 6, 2]
    kernel_size: 11
    dropout: 0.2
    seq_len: 269

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: true               
  num_workers: 4              
  
  evoaug:
    max_augs_per_seq: 2
    hard_aug: false
    distribution: "poisson"   
    poisson_lambda: 0.5
    augmentations:
      - name: "RandomDeletion"
        kwargs: {delete_min: 0, delete_max: 20}
      - name: "RandomInsertion"
        kwargs: {insert_min: 0, insert_max: 20}
      - name: "RandomTranslocation"
        kwargs: {shift_min: 0, shift_max: 20}
      - name: "RandomMutation"
        kwargs: {mut_frac: 0.05}
      - name: "NormalizeNoise" 
        kwargs: {noise_mean: 0.0, noise_std: 0.2}

  target_noise:
    apply: true               
    std: 0.05

training:
  lr: 0.0005
  weight_decay: 0.01
  epochs: 100
  early_stop: 20
  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.1
    eta_min: 1.0e-6
