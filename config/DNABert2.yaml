experiment_name: "DNABert2_FrozenHeads_v1"
seed: 42

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "DNABert2"
  kwargs:
    pretrained_name: "zhihan1996/DNABERT-2-117M"
    freeze_backbone: true       # train regression heads only
    lora: false
    hidden_dim: 256
    dropout_rate: 0.2           # non-zero = MC Dropout available at inference
    pool: "cls"                 # use [CLS] token embedding

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 32
  augment: false
  num_workers: 0
  strand_correct: true

training:
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 30
  early_stop: 8
  log_dir: "train_logs"

  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.1
    eta_min: 1.0e-6
