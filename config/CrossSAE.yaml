# ============================================================
# Cross Sparse Autoencoder — Unified Configuration
# Drives cross_sae.py in YAML-config mode (recommended).
# Can also be used as --data_config for CLI mode.
#
# YAML mode:
#   python cross_sae.py --sae_config config/CrossSAE.yaml
#
# CLI mode (legacy):
#   python cross_sae.py \
#       --configs config/DeepSTARR.yaml config/LegNetPlus.yaml \
#       --weights results/models/DeepSTARR/best_model.pth results/models/LegNet/best_model.pth \
#       --data_config config/CrossSAE.yaml
# ============================================================

experiment_name: "CrossSAE_Comparison"
seed: 42

models:
  - name: DeepSTARR
    config: config/DeepSTARR.yaml
    weights: results/models/DeepSTARR/best_model.pth

  - name: LegNetV2
    config: config/LegNetPlus.yaml
    weights: results/models/LegNet/best_model.pth

data_config: config/DeepSTARR.yaml

model:
  name: "DeepSTARR"
  kwargs:
    seq_len: 249

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 256
  augment: false
  num_workers: 4
  target_noise:
    apply: false

sae:
  hidden_dim: 512
  l1_coeff: 1.0e-3
  epochs: 200
  lr: 1.0e-3
  batch_size: 256

# Output
output_dir: results/cross_sae
