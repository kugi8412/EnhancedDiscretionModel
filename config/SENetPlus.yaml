experiment_name: "SENet_Augmented"
seed: 7898

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "SEResNet"
  kwargs:
    seq_len: 269              # 249 (original) + 20 (max insertion). Dynamic dimension.
    block_num: [2, 2, 2, 2]   # Following ResNet implementation
    in_channels: 4            # Kodowanie DNA One-Hot

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: true               # Augmentation ENABLED
  num_workers: 4              # Faster loading with CPU multithreading
  
  # Augmentation engine (Poisson distribution)
  evoaug:
    max_augs_per_seq: 2
    hard_aug: false
    distribution: "poisson"
    poisson_lambda: 1.0
    augmentations:
      - name: "RandomDeletion"
        kwargs: {delete_min: 0, delete_max: 30}
      - name: "RandomRC"
        kwargs: {rc_prob: 0.5}
      - name: "RandomInsertion"
        kwargs: {insert_min: 0, insert_max: 20}
      - name: "RandomTranslocation"
        kwargs: {shift_min: 0, shift_max: 20}
      - name: "RandomMutation"
        kwargs: {mut_frac: 0.05}
      - name: "NormalizeNoise"
        kwargs: {noise_mean: 0.0, noise_std: 0.3}

  target_noise:
    apply: true
    std: 0.05

training:
  lr: 0.001
  weight_decay: 0.0002
  epochs: 100
  early_stop: 16
  scheduler:
    apply: true
    type: "cosine"
    warmup_fraction: 0.1      # LR ramps linearly for first 10 epochs to stabilize training
    eta_min: 1.0e-6
