# ==========================================
# 1. Konfiguracja Treningu: Czysta Wyrocznia (LegNetV2)
# ==========================================

experiment_name: "LegNetV2_Oracle_Clean"
seed: 7898

comet:
  api_key: "V6s4QJ97ca130GE8M4G4MlU5D"
  project_name: "kamb"
  workspace: "kugi8412"

# --- ARCHITEKTURA MODELU ---
model:
  name: "LegNetV2"
  kwargs:
    in_ch: 4
    stem_ch: 256
    stem_ks: 5
    ef_ks: 5
    ef_block_sizes: [256, 128, 128, 64, 64, 32, 32]
    pool_sizes: [1, 2, 1, 2, 1, 2, 1]
    resize_factor: 4

# --- DANE (CZYSTE - BEZ AUGMENTACJI) ---
data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: false
  target_noise:
    apply: false

# --- PARAMETRY TRENINGU ---
training:
  epochs: 100
  batch_size: 128
  lr: 5.0e-4                 # Zostawiamy 0.0005
  weight_decay: 2.0e-3       # PODNIESIONO! Bez augmentacji potrzebujemy mocniejszej regularyzacji wag
  early_stop: 8
  log_dir: "train_logs/legnet_oracle"

  # Wyłączamy VQ-VAE, bo trenujemy samą Wyrocznię
  oracle_warmup_epochs: 0
  oracle_rampup_epochs: 1
  oracle_max_weight: 1.0
  recon_weight: 0.0
  vq_weight: 0.0
  oracle_bidirectional: false

  # Zaawansowany Scheduler
  scheduler:
    apply: false
    type: "cosine"
    eta_min: 1.0e-6
    warmup_fraction: 0.10         # 10 epok powolnego rozruchu
    weight_decay_scheduler: true  # <--- Dodany harmonogram opadania Weight Decay
    weight_decay_min: 1.0e-6
