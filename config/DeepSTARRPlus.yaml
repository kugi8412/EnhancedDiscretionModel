experiment_name: "DeepSTARR_Augmented"
seed: 7898

comet:
  api_key: ""
  project_name: "kamb"
  workspace: ""

model:
  name: "DeepSTARR"
  kwargs:
    seq_len: 269
    kernel_size1: 7
    kernel_size2: 3
    kernel_size3: 5
    kernel_size4: 3
    num_filters: 256
    num_filters2: 60
    num_filters3: 60
    num_filters4: 120
    dropout_prob: 0.4
    dense_neurons1: 256
    dense_neurons2: 256
    pad: 'same'
    permute_before_flatten: false

data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: true
  num_workers: 4
 
  # Full augmentation engine configuration
  evoaug:
    max_augs_per_seq: 2
    hard_aug: false
    distribution: "poisson"
    poisson_lambda: 0.5            
    augmentations:
      - name: "RandomDeletion"
        kwargs: {delete_min: 0, delete_max: 20}
      - name: "RandomRC"
        kwargs: {rc_prob: 0.5}
      - name: "RandomInsertion"
        kwargs: {insert_min: 0, insert_max: 20}
      - name: "RandomTranslocation"
        kwargs: {shift_min: 0, shift_max: 20}
      - name: "RandomMutation"
        kwargs: {mut_frac: 0.05}
      - name: "NormalizeNoise"
        kwargs: {noise_mean: 0.0, noise_std: 0.2}

  target_noise:
    apply: true
    std: 0.05

training:
  lr: 0.002
  epochs: 100
  early_stop: 10
  log_dir: "train_logs"
  scheduler:          
    apply: true
    type: "cosine"
    warmup_fraction: 0.1
    eta_min: 1.0e-6
