# ==========================================
# Konfiguracja Treningu: CustomNetwork + EvoAug
# ==========================================

experiment_name: "CustomNetwork_EvoAug_SuperKernel"
seed: 42

# --- ARCHITEKTURA MODELU ---
model:
  name: "CustomNetwork"
  kwargs:
    seq_len: 249
    # Parametry warstw konwolucyjnych (SuperKernel)
    num_channels: [300, 200, 200]
    kernel_widths: [19, 11, 7]
    pooling_widths: [3, 4, 4]
    # Parametry głowicy gęstej (Fully Connected)
    num_units: [2000, 2]
    dropout: 0.5

# --- PARAMETRY TRENINGU ---
training:
  epochs: 100
  batch_size: 128
  lr: 1.0e-3
  weight_decay: 1.0e-3            # Wyższy weight_decay dla lepszej generalizacji
  early_stop: 15
  log_dir: "train_logs/regseqnet"
  
  # Ustawienia pod uniwersalny skrypt (wyłączamy VQ-VAE, skupiamy się na czystej predykcji)
  oracle_warmup_epochs: 0
  oracle_rampup_epochs: 1
  oracle_max_weight: 1.0
  recon_weight: 0.0
  vq_weight: 0.0
  oracle_bidirectional: false

  # Scheduler z Warmupem i oddzielnym Weight Decay
  scheduler:
    apply: true
    type: "cosine"
    eta_min: 1.0e-6
    warmup_fraction: 0.05         # 15% epok to liniowy start (łagodniejsze wejście)
    weight_decay_scheduler: true
    weight_decay_min: 1.0e-6

# --- DANE & AUGMENTACJA EVO-AUG ---
data:
  dataset_path: "../../data/deepSTARR"
  batch_size: 128
  augment: true
  
  # Zintegrowany blok augmentacji biologicznej:
  evoaug:
    max_augs_per_seq: 2
    hard_aug: false
    distribution: "poisson"
    poisson_lambda: 1.0
    augmentations:
      - name: "RandomDeletion"
        kwargs: {delete_min: 0, delete_max: 30}
      - name: "RandomRC"
        kwargs: {rc_prob: 0.5}
      - name: "RandomInsertion"
        kwargs: {insert_min: 0, insert_max: 20}
      - name: "RandomTranslocation"
        kwargs: {shift_min: 0, shift_max: 20}
      - name: "RandomMutation"
        kwargs: {mut_frac: 0.05}
      - name: "NormalizeNoise"
        kwargs: {noise_mean: 0.0, noise_std: 0.3}

